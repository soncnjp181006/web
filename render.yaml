# Render Blueprint for VulnShop
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo -> Apply
#
# Creates:
#   - vulnshop-backend  (Docker: nginx gateway + node)
#   - vulnshop-st       (Supertokens core, private service)
#   - vulnshop-redis    (Render Key Value, free)
#   - vulnshop-db       (Render PostgreSQL, free - NOTE: free DBs expire after 30 days)

services:
  - type: web
    name: vulnshop-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vulnshop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: vulnshop-redis
          property: connectionString
      - key: SUPERTOKENS_CONNECTION_URI
        value: http://vulnshop-st:3563
      - key: INTERNAL_PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      # ---- fill these in the Render dashboard (Blueprint asks on apply) ----
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: API_DOMAIN
        sync: false # e.g. https://vulnshop.pages.dev (set after CF Pages exists)
      - key: WEBSITE_DOMAIN
        sync: false

  - type: pserv
    name: vulnshop-st
    runtime: docker
    dockerfilePath: ./infra/supertokens/Dockerfile
    dockerContext: ./infra/supertokens
    plan: starter
    envVars:
      - key: POSTGRESQL_CONNECTION_URI
        fromDatabase:
          name: vulnshop-db
          property: connectionString

  - type: redis
    name: vulnshop-redis
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: vulnshop-db
    plan: free
