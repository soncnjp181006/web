# VulnShop nginx gateway - INTENTIONALLY WEAK CONFIGURATION (training).
# Weaknesses here:
#   - server_tokens on          -> version disclosure (#42/#43)
#   - NO security headers       -> no HSTS, X-Frame-Options, nosniff, CSP (#39/#41/#70)
#   - client_max_body_size 0    -> unlimited request body (DoS #74)
#   - Host forwarded verbatim   -> host header injection (#35)
#   - X-Forwarded-* merged from client input -> spoofable (#52), reflected (#37/#65)
#   - HTTP/1.1 proxying without strict framing rules -> request-smuggling
#     class misconfig when chained with other proxies (#33, document-only demo)
#   - autoindex on /uploads     -> directory listing (#42)

server {
    listen 10000;
    server_name _;
    server_tokens on;

    # ---- deliberately missing: add_header Strict-Transport-Security ...
    # ---- deliberately missing: add_header X-Frame-Options DENY ...
    # ---- deliberately missing: add_header X-Content-Type-Options nosniff ...
    # ---- deliberately missing: Content-Security-Policy ...
    add_header X-Powered-By "Express/nginx" always;
    add_header Referrer-Policy "unsafe-url" always;

    # no request size limit at the gateway (#74)
    client_max_body_size 0;

    # static uploads with directory listing enabled (#42)
    location /uploads/ {
        alias /app/uploads/;
        autoindex on;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # pass attacker-controlled Host through to the app (#35)
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;

        # merge client-supplied XFF into the chain (spoofable, #52, reflected #37)
        proxy_set_header X-Forwarded-For $http_x_forwarded_for, $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Port $http_x_forwarded_port;

        # ambiguous framing for the smuggling class (#33): keep both hop-by-hop
        # headers flowing instead of normalizing them
        proxy_set_header Connection $http_connection;
        proxy_set_header Transfer-Encoding $http_transfer_encoding;
        proxy_pass_request_headers on;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
